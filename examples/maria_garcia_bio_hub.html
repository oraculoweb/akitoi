<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Garcia - Akitoi Bio Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            width: 100%;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: none;
        }

        .logo.visible {
            display: block;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 24px;
            overflow: hidden;
            border: 4px solid #6366f1;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #6366f120, #6366f140);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .profile-bio {
            font-size: 16px;
            color: #1e293bcc;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
            padding: 16px;
            background: #6366f110;
            border-radius: 12px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #6366f1;
        }

        .stat-label {
            font-size: 12px;
            color: #1e293b99;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 32px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            background: white;
            border: 2px solid #6366f120;
            border-radius: 16px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #6366f110, transparent);
            transition: left 0.5s;
        }

        .link-button:hover::before {
            left: 100%;
        }

        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px #6366f120;
            border-color: #6366f1;
            background: #6366f105;
        }

        .link-button:active {
            transform: translateY(0);
        }

        .link-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .link-title {
            flex: 1;
            text-align: center;
        }

        .link-clicks {
            font-size: 12px;
            color: #1e293b66;
            background: #6366f110;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #6366f120;
        }

        .powered-by {
            font-size: 14px;
            color: #1e293b66;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .akitoi-logo {
            font-weight: 700;
            color: #6366f1;
            text-decoration: none;
            transition: color 0.3s;
        }

        .akitoi-logo:hover {
            color: #1e293b;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px 16px;
            }

            .profile-name {
                font-size: 28px;
            }

            .profile-bio {
                font-size: 15px;
            }

            .link-button {
                padding: 16px 20px;
                font-size: 15px;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <div class="logo" id="logo">
                <img src="" alt="Logo" id="logo-img">
            </div>

            <div class="profile-image" id="profile-image">
                <span class="pulse">👤</span>
            </div>

            <h1 class="profile-name">Maria Garcia</h1>
            <p class="profile-bio">Digital Marketing Expert | Content Creator | Tech Enthusiast</p>

            <div class="profile-stats">
                <div class="stat">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Views</div>
                </div>
                <div class="stat">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Clicks</div>
                </div>
                <div class="stat">
                    <div class="stat-value">6</div>
                    <div class="stat-label">Links</div>
                </div>
            </div>
        </div>

        <div class="links-container" id="links-container">
            <!-- Links will be inserted here by JavaScript -->
        </div>

        <div class="footer">
            <div class="powered-by">
                Powered by
                <a href="https://akitoi.bio" class="akitoi-logo">Akitoi</a>
            </div>
        </div>
    </div>

    <script>
        // Profile data
        const profileData = {
            "name": "Maria Garcia",
            "bio": "Digital Marketing Expert | Content Creator | Tech Enthusiast",
            "slug": "maria-garcia",
            "profile_image_url": null,
            "logo_url": null,
            "links": [
                {
                    "title": "Chat on WhatsApp",
                    "url": "+34612345678",
                    "link_type": "whatsapp",
                    "icon": "💬",
                    "is_active": true,
                    "clicks": 0
                },
                {
                    "title": "Send me an email",
                    "url": "maria@example.com",
                    "link_type": "email",
                    "icon": "✉️",
                    "is_active": true,
                    "clicks": 0
                },
                {
                    "title": "LinkedIn Profile",
                    "url": "https://linkedin.com/in/mariagarcia",
                    "link_type": "linkedin",
                    "icon": "💼",
                    "is_active": true,
                    "clicks": 0
                },
                {
                    "title": "Portfolio Website",
                    "url": "https://mariagarcia.com",
                    "link_type": "website",
                    "icon": "🌐",
                    "is_active": true,
                    "clicks": 0
                },
                {
                    "title": "Twitter/X",
                    "url": "https://x.com/mariagarcia",
                    "link_type": "twitter",
                    "icon": "🐦",
                    "is_active": true,
                    "clicks": 0
                },
                {
                    "title": "AI Assistant",
                    "url": "https://chat.example.com/maria-ai",
                    "link_type": "ai_agent",
                    "icon": "🧠",
                    "is_active": true,
                    "clicks": 0
                }
            ],
            "views": 0
        };

        // Initialize profile
        function initProfile() {
            // Set logo if available
            if (profileData.logo_url) {
                const logo = document.getElementById('logo');
                const logoImg = document.getElementById('logo-img');
                logoImg.src = profileData.logo_url;
                logo.classList.add('visible');
            }

            // Set profile image if available
            if (profileData.profile_image_url) {
                const profileImage = document.getElementById('profile-image');
                profileImage.innerHTML = `<img src="${profileData.profile_image_url}" alt="${profileData.name}">`;
            }

            // Render links
            renderLinks();
        }

        function renderLinks() {
            const linksContainer = document.getElementById('links-container');

            profileData.links.forEach((link, index) => {
                if (!link.is_active) return;

                const linkElement = document.createElement('a');
                linkElement.className = 'link-button';
                linkElement.href = getActualUrl(link);
                linkElement.target = '_blank';
                linkElement.rel = 'noopener noreferrer';
                linkElement.style.animationDelay = `${index * 0.1}s`;

                linkElement.innerHTML = `
                    <span class="link-icon">${link.icon}</span>
                    <span class="link-title">${link.title}</span>
                    <span class="link-clicks">${link.clicks} clicks</span>
                `;

                // Track clicks (in a real app, this would send to analytics)
                linkElement.addEventListener('click', () => {
                    console.log(`Clicked: ${link.title}`);
                    // In production: trackLinkClick(profileData.slug, index);
                });

                linksContainer.appendChild(linkElement);
            });
        }

        function getActualUrl(link) {
            switch (link.link_type) {
                case 'whatsapp':
                    return `https://wa.me/${link.url.replace(/\D/g, '')}`;
                case 'email':
                    return `mailto:${link.url}`;
                default:
                    return link.url;
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initProfile);
    </script>
</body>
</html>
