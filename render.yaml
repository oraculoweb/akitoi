# Render.com deployment configuration
services:
  # FastAPI Backend
  - type: web
    name: akitoi-api
    env: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn src.akitoi.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akitoi-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production

databases:
  # PostgreSQL Database
  - name: akitoi-db
    plan: free
    databaseName: akitoi
    user: akitoi
